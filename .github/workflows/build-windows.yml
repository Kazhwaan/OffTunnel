name: Build Windows exe

# Builds OffTunnel on a real Windows runner (a .exe cannot be built
# on Linux/macOS) and publishes it as a GitHub Release + workflow artifact.
"on":
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Generate icon files
        run: python scripts/generate_icons.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable exe
        run: pyinstaller --noconfirm --clean --noconsole --name OffTunnel --uac-admin --add-data "data;data" --add-data "assets;assets" --icon assets/logo.ico offtunnel.pyw

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean --noconsole --onefile --name OffTunnel --uac-admin --add-data "data;data" --add-data "assets;assets" --icon assets/logo.ico offtunnel.pyw

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffTunnel-windows
          path: |
            dist/OffTunnel.exe
            dist/OffTunnel/

      # The MCP GitHub connector has no create-tag / create-release tool,
      # so the release is created here, from the Windows runner, using the
      # workflow's own GITHUB_TOKEN. On a push to main this creates tag
      # v0.1.1 (if it does not exist yet) and attaches the single-file exe.
      # On a v* tag push it releases that tag instead.
      - name: Create GitHub Release with the exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}
          name: OffTunnel ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}
          files: dist/OffTunnel.exe
          body: |
            OffTunnel — Windows VPN split tunneling. Local traffic goes off the tunnel.

            Iranian-first: all Iran IPv4 ranges go direct while the VPN stays on.
            Manual domain / IP / CIDR rules are supported too.

            Download OffTunnel.exe below and run it as Administrator.
